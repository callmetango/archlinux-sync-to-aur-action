name: Arch Linux sync repository to AUR action
description: GitHub Action to sync a given repository to the AUR.
author: callmetango

inputs:
  repository:
    description: |
      The name of the GitHub repository to work on in the form [HOST/]OWNER/REPO.
      It defaults to the repository where the workflow is run.
  aur-repository:
    description: |
      The name of the AUR repository. It defaults to the name of the GitHub repository.
  ssh-private-key:
    description: The SSH private key to use when connecting to the AUR
    type: string
    required: true

  ssh-key-fingerprints:
    description: The SHA256 fingerprints of the AUR SSH host keys
    type: string
    default: |
      ed25519: SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4
      ecdsa: SHA256:uTa/0PndEgPZTf76e1DFqXKJEXKsn7m9ivhLQtzGOCI
      rsa: SHA256:5s5cIyReIfNNVGRFdDbe3hdYiI5OelHGpw2rOUud3Q8

runs:
  using: composite
  steps:
    - name: Set up environment
      shell: sh
      env: # composite actions do not auto-export INPUT_*
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_AUR_REPOSITORY: ${{ inputs.aur-repository }}
      run: |
        set -u
        REPO="${INPUT_REPOSITORY:-$GITHUB_REPOSITORY}"
        printf 'REPOSITORY=%s\n' "$REPO" >> $GITHUB_ENV
        AUR_REPO="$INPUT_AUR_REPOSITORY"
        test "$AUR_REPO" || AUR_REPO="${REPO##*/}"
        echo "AUR_REPO: $AUR_REPO"
        printf 'AUR_REPOSITORY=%s\n' "$AUR_REPO" >> $GITHUB_ENV
        
        mkdir -m 0700 -p ~/.ssh
        printf '${{ inputs.ssh-key-fingerprints }}' > ~/.ssh/aur-fingerprints

    - name: Verify AUR SSH host key fingerprints
      shell: sh
      run: |
        sh "$GITHUB_ACTION_PATH"/scripts/verify-ssh-fingerprints.sh \
            aur.archlinux.org ~/.ssh/aur-fingerprints ~/.ssh/known_hosts
        
    - name: Sync repository to AUR
      shell: sh
      run: |
        echo "Syncing..."
        set -u
        
        eval $(ssh-agent)
        printf '%s\n' '${{ inputs.ssh-private-key }}' | tr -d '\r' | ssh-add -
        
        #ssh aur@aur.archlinux.org help

        cd "$HOME"
        mkdir dummy-repo && cd dummy-repo

        echo "REPOSITORY: $REPOSITORY"

        git config set --global advice.defaultBranchName false
        git init .
        git remote add origin "$GITHUB_SERVER_URL"/"$REPOSITORY"
        git remote add aur ssh://aur@aur.archlinux.org/"$AUR_REPOSITORY".git
        git remote -v

        git fetch origin
        BRANCH=$(git symbolic-ref --short HEAD)
        echo "BRANCH: $BRANCH"
        #git push aur "origin/$BRANCH:refs/heads/$BRANCH"
